services:
  # Database service configuration for MySQL
  db:
    # Automatically restart the container on errors or Docker restart
    restart: always

    # Use the official MySQL image version 9.2.0
    image: mysql:9.2.0

    # Map port 3306 (MySQL) from container to the host machine
    ports:
      - "3306:3306"

    # Set environment variables for MySQL container
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes  # Allow empty root password (NOT recommended for production)

    # Health check to ensure the database is ready
    healthcheck:
      # Execute a command to check database status
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root"]
      interval: 10s         # Check every 10 seconds
      timeout: 10s          # Maximum wait time for a response
      retries: 5            # Number of attempts before marking the container as unhealthy
      start_period: 30s     # Wait 30 seconds before starting health checks after launch

  # phpMyAdmin service configuration for MySQL management
  phpmyadmin:
    # Automatically restart the container on errors or Docker restart
    restart: always

    # Use the latest official phpMyAdmin image
    image: phpmyadmin:latest

    # Map port 80 (phpMyAdmin) from container to port 8080 on the host
    ports:
      - "8080:80"

  # PHP (Laravel application) service configuration
  php:
    # Assign a custom container name
    container_name: backend

    # Automatically restart the container on errors or Docker restart
    restart: always

    # Use the custom built image for the application
    image: conference_cms_registry/backend:1.0

    # Build the container from the Dockerfile
    build:
      context: ../conference-cms-backend/       # Path to the project root directory
      dockerfile: ../conference-cms-backend/Docker/Dockerfile  # Path to the Dockerfile

    # Wait for the database to be ready before starting
    depends_on:
      db:
        condition: service_healthy  # Ensures the PHP container starts only when the database is healthy

    # Map port 8000 from container to the host machine
    ports:
      - "8000:8000"

    # Mount the local project directory to the container
    volumes:
      - ../conference-cms-backend:/conference-cms-backend  # Enables file sync (live reload)

    # Enable terminal interaction (TTY) for the container
    tty: true
